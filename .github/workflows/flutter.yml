name: Flutter

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/flutter.yml'

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS, because the screen goldens in app/test/golden are macOS-rendered.
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
